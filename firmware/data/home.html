<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    header {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
    }
    main {
      padding: 10px;
    }
    .mb-1{
        margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-primary {
      background-color: #3490dc;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #2779bd;
    }
    .input {
      display: block;
      width: 98.5%;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.25rem;
      transition: border-color 0.3s;
    }

    .input:focus {
      border-color: #3490dc;
      outline: none;
    }
    
    @media (min-width: 768px) {
      body {
        padding: 40px;
      }
      header {
        padding: 20px;
      }
      main {
        border: 1px solid #ccc;
        border-radius: 5px;
      }
    }
  </style>
</head>
<body>
  <header class="mb-1">
    <h1>Timer Swtich</h1>
  </header>
    <main>
        <h2>Welcome</h2>
        <h3>{{time_now}}</h3>
        <form method="post">
            <label>Set Date & Time</label>
            <input type="datetime-local" class="input mb-1 datetime" name="current_date_time" placeholder="Date & Time">
            <label>Start Time</label>
            <input type="time" value="{{start_time}}" class="input mb-1 time" name="start_time" placeholder="Start Time" required>
            <label>Stop Time</label>
            <input type="time" value="{{stop_time}}"  class="input mb-1 time" name="stop_time" placeholder="Stop Time" required>
            <button class="btn btn-primary">Submit</button>
        </form>
    </main>
    <script>
    </script>
</body>
</html>
